<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direktori Pegawai</title>
<style>
  :root{
    --ink:#1c2230;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#dfdad0;
    --keuangan:#2f6f4f;
    --keuangan-bg:#eaf3ec;
    --teknik:#8a4a12;
    --teknik-bg:#f6ece0;
    --muted:#726f68;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  header{
    padding:48px 24px 24px;
    text-align:center;
  }
  header .eyebrow{
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
  }
  header h1{
    font-size:clamp(28px,4vw,40px);
    margin:0;
    font-weight:700;
  }
  header p{
    color:var(--muted);
    margin-top:10px;
  }
  main{
    max-width:880px;
    margin:0 auto;
    padding:0 24px 64px;
  }
  .menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:28px;
  }
  @media (max-width:560px){
    .menu{grid-template-columns:1fr;}
  }
  .menu-btn{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:14px;
    padding:22px 20px;
    text-align:left;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    font-family:inherit;
  }
  .menu-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.06);
  }
  .menu-btn .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .menu-btn.keuangan .tag{background:var(--keuangan-bg); color:var(--keuangan);}
  .menu-btn.teknik .tag{background:var(--teknik-bg); color:var(--teknik);}
  .menu-btn.active{border-color:var(--ink);}
  .menu-btn h3{margin:0 0 4px; font-size:19px;}
  .menu-btn p{margin:0; font-size:13px; color:var(--muted);}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    min-height:160px;
  }
  .panel h2{
    margin:0 0 4px;
    font-size:20px;
  }
  .panel .count{
    font-size:13px;
    color:var(--muted);
    margin-bottom:18px;
  }
  ul.employee-list{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:10px;
  }
  ul.employee-list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
  }
  ul.employee-list li .num{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .placeholder, .state{
    color:var(--muted);
    font-size:14px;
    padding:20px 0;
    text-align:center;
  }
  .state.error{color:#b23b3b;}

  /* ---- Login screen ---- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-box{
    width:100%;
    max-width:360px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px 28px;
    text-align:center;
  }
  .login-title{
    margin:6px 0 6px;
    font-size:26px;
    font-weight:700;
  }
  .login-sub{
    color:var(--muted);
    font-size:13px;
    margin:0 0 22px;
  }
  #login-form{
    display:flex;
    flex-direction:column;
    gap:6px;
    text-align:left;
  }
  #login-form label{
    font-size:12px;
    color:var(--muted);
    margin-top:10px;
  }
  #login-form input{
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:var(--paper);
  }
  #login-form input:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
  }
  #login-submit{
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:var(--ink);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  #login-submit:disabled{
    opacity:.6;
    cursor:default;
  }
  #login-submit:hover:not(:disabled){opacity:.9;}
  .login-msg{
    min-height:18px;
    font-size:13px;
    margin-top:12px;
    color:#b23b3b;
    text-align:center;
  }

  /* ---- Logout button ---- */
  .logout-btn{
    margin-top:16px;
    padding:8px 16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .logout-btn:hover{background:var(--paper);}
</style>
</head>
<body>

<!-- ===== HALAMAN LOGIN ===== -->
<div id="login-screen">
  <div class="login-box">
    <div class="eyebrow">Direktori Internal</div>
    <h1 class="login-title">Masuk</h1>
    <p class="login-sub">Masukkan ID dan password untuk mengakses data pegawai.</p>
    <form id="login-form">
      <label for="login-username">ID</label>
      <input type="text" id="login-username" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
      <button type="submit" id="login-submit">Masuk</button>
      <div class="login-msg" id="login-msg"></div>
    </form>
  </div>
</div>

<!-- ===== KONTEN UTAMA (baru terlihat setelah login) ===== -->
<div id="app-content" style="display:none;">
  <header>
    <div class="eyebrow">Direktori Internal</div>
    <h1>Data Pegawai per Bagian</h1>
    <p>Pilih bagian di bawah untuk melihat daftar nama pegawai.</p>
    <button id="logout-btn" class="logout-btn">Keluar</button>
  </header>

  <main>
    <div class="menu">
      <button class="menu-btn keuangan" id="btn-keuangan">
        <span class="tag">Menu 1</span>
        <h3>Bagian Keuangan</h3>
        <p>Lihat daftar pegawai bagian keuangan</p>
      </button>
      <button class="menu-btn teknik" id="btn-teknik">
        <span class="tag">Menu 2</span>
        <h3>Bagian Teknik</h3>
        <p>Lihat daftar pegawai bagian teknik</p>
      </button>
    </div>

    <div class="panel" id="panel">
      <div class="placeholder">Klik salah satu bagian di atas untuk menampilkan daftar pegawai.</div>
    </div>
  </main>
</div>

<script>
/* ======================================================================
   KONFIGURASI
   ----------------------------------------------------------------------
   1. Ganti GID_KEUANGAN dan GID_TEKNIK di bawah ini dengan gid dari
      masing-masing tab/sheet.
   2. Cara mendapatkan gid:
      - Buka spreadsheet aslinya (bukan link pubhtml)
      - Klik tab "Keuangan", lihat URL di address bar, contoh:
        ...edit#gid=123456789   -> gid-nya adalah 123456789
      - Lakukan hal sama untuk tab "Teknik"
      - Kalau tab tersebut adalah sheet PERTAMA di file, gid-nya biasanya 0
   3. Pastikan sheet sudah dipublish ke web (File > Share > Publish to web).
   ====================================================================== */
const SHEET_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqGoRVZPqNYVix0fz_dIX4nkQKsXfn0K0xC6srxbC9mNB_PA9Cwj7ohLFUNOHAWDjp8LSvlU8x4lQp/pub";

// URL Web App Apps Script untuk cek login
const LOGIN_API_URL = "https://script.google.com/macros/s/AKfycby9qlZhTBi24_qyuZznTDPtYYtmIdT_8E-nstKMFtoSHhwGCXoCXHlGgIquGmz2KbUI/exec";

const DEPARTMENTS = {
  keuangan: {
    label: "Bagian Keuangan",
    gid: "186650531"
  },
  teknik: {
    label: "Bagian Teknik",
    gid: "565200320"
  }
};

/* ================== LOGIN LOGIC ================== */
const loginScreen = document.getElementById("login-screen");
const appContent = document.getElementById("app-content");
const loginForm = document.getElementById("login-form");
const loginMsg = document.getElementById("login-msg");
const loginSubmit = document.getElementById("login-submit");
const logoutBtn = document.getElementById("logout-btn");

function showApp(){
  loginScreen.style.display = "none";
  appContent.style.display = "block";
}
function showLogin(){
  appContent.style.display = "none";
  loginScreen.style.display = "flex";
}

// Cek apakah sudah pernah login di sesi browser ini
if (sessionStorage.getItem("loggedIn") === "true"){
  showApp();
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value.trim();

  loginMsg.textContent = "";
  loginSubmit.disabled = true;
  loginSubmit.textContent = "Memeriksa...";

  try {
    const res = await fetch(LOGIN_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // hindari CORS preflight
      body: JSON.stringify({ username, password })
    });
    const result = await res.json();

    if (result.success){
      sessionStorage.setItem("loggedIn", "true");
      showApp();
    } else {
      loginMsg.textContent = result.message || "ID atau password salah.";
    }
  } catch (err){
    loginMsg.textContent = "Gagal menghubungi server login. Coba lagi.";
  } finally {
    loginSubmit.disabled = false;
    loginSubmit.textContent = "Masuk";
  }
});

logoutBtn.addEventListener("click", () => {
  sessionStorage.removeItem("loggedIn");
  loginForm.reset();
  showLogin();
});

/* ================== DIREKTORI PEGAWAI LOGIC ================== */
const panel = document.getElementById("panel");
const buttons = {
  keuangan: document.getElementById("btn-keuangan"),
  teknik: document.getElementById("btn-teknik")
};

Object.keys(buttons).forEach(key => {
  buttons[key].addEventListener("click", () => loadDepartment(key));
});

function csvUrl(gid){
  return `${SHEET_BASE}?gid=${gid}&single=true&output=csv`;
}

// Parser CSV sederhana (menangani koma di dalam tanda kutip)
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

function findNameColumnIndex(header){
  const idx = header.findIndex(h => h.toLowerCase().trim().includes("nama"));
  return idx !== -1 ? idx : 0;
}

async function loadDepartment(key){
  Object.values(buttons).forEach(b => b.classList.remove("active"));
  buttons[key].classList.add("active");

  const dept = DEPARTMENTS[key];
  panel.innerHTML = `<div class="state">Memuat data ${dept.label}...</div>`;

  try {
    const res = await fetch(csvUrl(dept.gid));
    if (!res.ok) throw new Error("Gagal mengambil data (status " + res.status + ")");
    const text = await res.text();
    const rows = parseCSV(text);

    if (rows.length === 0){
      panel.innerHTML = `<div class="state error">Data ${dept.label} kosong atau tidak ditemukan.</div>`;
      return;
    }

    const header = rows[0];
    const nameIdx = findNameColumnIndex(header);
    const names = rows.slice(1)
      .map(r => (r[nameIdx] || "").trim())
      .filter(n => n !== "");

    if (names.length === 0){
      panel.innerHTML = `<div class="state error">Tidak ada nama pegawai yang terbaca di ${dept.label}.</div>`;
      return;
    }

    panel.innerHTML = `
      <h2>${dept.label}</h2>
      <div class="count">${names.length} pegawai</div>
      <ul class="employee-list">
        ${names.map((n, i) => `<li><span class="num">${i+1}</span>${escapeHtml(n)}</li>`).join("")}
      </ul>
    `;
  } catch (err){
    panel.innerHTML = `<div class="state error">Terjadi kesalahan saat memuat data: ${escapeHtml(err.message)}<br><br>
      Pastikan sheet sudah dipublish ke web dan gid sudah diisi dengan benar di dalam kode.</div>`;
  }
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
