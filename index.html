<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Master WO</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text-main: #ffffff;
    --text-muted: #a0aec0;
    --glass-bg: rgba(20, 25, 35, 0.55);
    --glass-border: rgba(255, 255, 255, 0.15);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    --accent-blue: #3182ce;
    --accent-orange: #dd6b20;
    --accent-green: #38a169;
    --rejected: #e53e3e;
  }
  
  * { 
    box-sizing: border-box; 
  }
  
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    /* Animasi Gradasi Sinematik */
    background: linear-gradient(-45deg, #0b192c, #1a365d, #5c3a21, #0f3a24);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Logo Global di Pojok Kanan Atas */
  .global-logos {
    position: absolute;
    top: 24px;
    right: 32px;
    display: flex;
    gap: 16px;
    z-index: 100;
  }

  .global-logos img {
    height: 170px; 
    object-fit: contain;
    background: transparent; 
    padding: 0; 
    border-radius: 0; 
    /* Menggunakan drop-shadow berlapis untuk membuat efek cahaya putih di belakang teks hitam */
    filter: drop-shadow(0px 0px 4px rgba(255, 255, 255, 0.9)) 
            drop-shadow(0px 0px 15px rgba(255, 255, 255, 0.5));
  }

  header {
    padding: 64px 24px 24px;
    text-align: center;
  }

  header h1 {
    font-size: clamp(28px, 4vw, 44px);
    margin: 0;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  header p {
    color: var(--text-muted);
    margin-top: 10px;
    font-weight: 300;
  }
  
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  
  /* Desain Panel Glassmorphism */
  .glass-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    box-shadow: var(--glass-shadow);
  }

  /* Menu Utama */
  .main-menu {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  @media (max-width: 768px) {
    .main-menu { 
      grid-template-columns: 1fr 1fr; 
    }
    .global-logos {
      position: static;
      justify-content: center;
      padding-top: 24px;
      margin-bottom: -30px;
    }
  }

  .btn-main {
    padding: 16px 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    color: var(--text-muted);
  }

  .btn-main.active {
    color: #fff;
    border-color: var(--accent-blue);
    background: rgba(49, 130, 206, 0.2);
    box-shadow: 0 0 20px rgba(49, 130, 206, 0.4);
    transform: translateY(-2px);
  }

  .btn-main:hover:not(.active) { 
    background: rgba(255, 255, 255, 0.1); 
    color: #fff;
  }

  /* Sub Menu */
  .sub-menu {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    justify-content: center;
    flex-wrap: wrap; /* Agar rapi jika tombol banyak */
  }

  .btn-sub {
    padding: 8px 20px;
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    background: rgba(0,0,0,0.3);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.3s ease;
  }

  .btn-sub.active {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 15px rgba(56, 161, 105, 0.4);
  }

  /* Filter Bar */
  .filter-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    align-items: center;
    padding: 16px 20px;
    flex-wrap: wrap;
  }

  .filter-bar select, .filter-bar input {
    padding: 10px 14px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    background: rgba(0, 0, 0, 0.4);
    color: #fff;
    transition: all 0.2s;
  }

  .filter-bar select option { 
    background: #1a202c; 
    color: #fff; 
  }

  .filter-bar select:focus, .filter-bar input:focus {
    outline: none;
    border-color: var(--accent-orange);
    box-shadow: 0 0 10px rgba(221, 107, 32, 0.4);
  }

  .filter-bar button {
    padding: 10px 16px;
    background: var(--accent-orange);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    transition: all 0.2s;
  }

  .filter-bar button:hover { 
    background: #c05621;
    box-shadow: 0 0 15px rgba(221, 107, 32, 0.6);
  }

  /* Panel Data */
  .panel {
    padding: 30px;
    min-height: 200px;
  }

  .panel h2 { 
    margin: 0 0 6px; 
    font-size: 22px; 
    text-transform: capitalize; 
    font-weight: 600; 
  }

  .panel .count { 
    font-size: 13px; 
    color: var(--text-muted); 
    margin-bottom: 24px; 
  }
  
  ul.data-list {
    list-style: none; 
    margin: 0; 
    padding: 0; 
    display: grid; 
    gap: 12px;
  }

  ul.data-list li {
    display: flex; 
    align-items: center; 
    gap: 16px;
    padding: 16px; 
    border: 1px solid var(--glass-border);
    border-radius: 12px; 
    background: rgba(0, 0, 0, 0.2);
    font-size: 14px; 
    cursor: pointer; 
    transition: all 0.2s ease;
  }

  ul.data-list li:hover {
    transform: translateX(6px);
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--accent-blue);
    box-shadow: 0 4px 15px rgba(49, 130, 206, 0.2);
  }

  ul.data-list li .num {
    width: 32px; 
    height: 32px; 
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-orange), #c05621);
    color: #fff; 
    font-size: 13px; 
    font-weight: 600;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  
  .placeholder, .state { 
    color: var(--text-muted); 
    font-size: 14px; 
    padding: 20px 0; 
    text-align: center; 
  }

  .state.error { 
    color: #fc8181; 
  }

  /* Modal Detail */
  .modal-overlay {
    display: none;
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(5px);
    z-index: 1000;
    align-items: center; 
    justify-content: center;
    padding: 20px;
  }

  .modal-content {
    width: 100%; 
    max-width: 600px;
    max-height: 85vh;
    display: flex; 
    flex-direction: column;
    position: relative;
  }

  .modal-header {
    padding: 24px; 
    border-bottom: 1px solid var(--glass-border);
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    background: rgba(0,0,0,0.2);
    border-radius: 16px 16px 0 0;
  }

  .modal-header h3 { 
    margin: 0; 
    font-size: 18px; 
    font-weight: 600; 
  }

  .close-btn {
    background: none; 
    border: none; 
    font-size: 28px; 
    cursor: pointer; 
    color: var(--text-muted);
    transition: color 0.2s;
  }

  .close-btn:hover { 
    color: #fff; 
  }

  .modal-body {
    padding: 24px; 
    overflow-y: auto;
    border-radius: 0 0 16px 16px;
  }
  
  /* Tampilan Badge Akses Role */
  .role-badge {
    display: inline-block;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    margin-bottom: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  
  /* Tombol Aksi (Khusus Engineering) */
  .action-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px dashed rgba(255,255,255,0.2);
    display: flex;
    gap: 12px;
  }

  .btn-action {
    flex: 1;
    padding: 12px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: #fff;
    transition: opacity 0.2s;
  }

  .btn-action:hover { 
    opacity: 0.8; 
  }

  .btn-approve { 
    background: var(--accent-green); 
  }

  .btn-reject { 
    background: var(--rejected); 
  }

  .btn-action:disabled { 
    opacity: 0.5; 
    cursor: not-allowed; 
  }

  .detail-row {
    display: flex; 
    flex-direction: column; 
    gap: 6px;
    margin-bottom: 16px; 
    padding-bottom: 16px; 
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .detail-row:last-child { 
    border-bottom: none; 
    margin-bottom: 0; 
    padding-bottom: 0; 
  }

  .detail-label { 
    font-size: 11px; 
    font-weight: 600; 
    color: var(--text-muted); 
    text-transform: uppercase; 
    letter-spacing: 1px; 
  }

  .detail-value { 
    font-size: 15px; 
    color: #fff; 
    white-space: pre-wrap; 
    font-weight: 300; 
  }

  /* Layar Login */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-box {
    width: 100%;
    max-width: 380px;
    padding: 40px 32px;
    text-align: center;
  }

  .login-box h1 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 700;
  }

  #login-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    margin-top: 28px;
  }

  #login-form label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 8px;
    font-weight: 600;
  }

  #login-form input {
    padding: 12px 16px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: rgba(0,0,0,0.3);
    color: #fff;
  }

  #login-form input:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 12px rgba(49, 130, 206, 0.4);
  }

  #login-submit {
    margin-top: 24px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent-blue), #2b6cb0);
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    font-size: 15px;
    transition: all 0.2s;
  }

  #login-submit:hover {
    box-shadow: 0 0 15px rgba(49, 130, 206, 0.6);
    transform: translateY(-1px);
  }

  .logout-btn {
    margin-top: 20px;
    padding: 10px 24px;
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    font-size: 13px;
    cursor: pointer;
    color: #fff;
    font-family: inherit;
    transition: all 0.2s;
  }

  .logout-btn:hover {
    background: rgba(229, 62, 62, 0.8);
    border-color: transparent;
  }

  .login-msg {
    color: #fc8181;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
  }

  /* Custom Scrollbar untuk Modal */
  ::-webkit-scrollbar { 
    width: 8px; 
  }
  ::-webkit-scrollbar-track { 
    background: rgba(0,0,0,0.1); 
    border-radius: 4px; 
  }
  ::-webkit-scrollbar-thumb { 
    background: rgba(255,255,255,0.2); 
    border-radius: 4px; 
  }
  ::-webkit-scrollbar-thumb:hover { 
    background: rgba(255,255,255,0.4); 
  }
</style>
</head>
<body>

<!-- Logo Global -->
<div class="global-logos">
  <img src="logo inl (3).png" alt="Logo INL">
</div>

<!-- Layar Login -->
<div id="login-screen">
  <div class="login-box glass-panel">
    <h1>Aplikasi WO</h1>
    <p style="color:var(--text-muted); font-size:14px; margin:0;">Silakan masuk untuk melanjutkan</p>
    <form id="login-form">
      <label>ID</label>
      <input type="text" id="login-username" required>
      <label>Password</label>
      <input type="password" id="login-password" required>
      <button type="submit" id="login-submit">Masuk</button>
      <div class="login-msg" id="login-msg"></div>
    </form>
  </div>
</div>

<!-- Konten Utama Dashboard -->
<div id="app-content" style="display:none;">
  <header>
    <h1>Dashboard Master WO</h1>
    <p>Pantau keseluruhan tiket Work Order secara realtime.</p>
    
    <!-- Menampilkan Role Pengguna Aktif di Bawah Judul -->
    <div id="user-role-badge" class="role-badge"></div><br>
    
    <button id="logout-btn" class="logout-btn">Keluar Dashboard</button>
  </header>

  <main>
    <!-- Menu Utama (Kategori) -->
    <div class="main-menu">
      <button class="btn-main glass-panel active" data-category="master">Master WO</button>
      <button class="btn-main glass-panel" data-category="mechanical">Mechanical</button>
      <button class="btn-main glass-panel" data-category="electrical">Electrical</button>
      <button class="btn-main glass-panel" data-category="modification">Modification</button>
    </div>

    <!-- Sub Menu (Status) dengan Tambahan 2 Status Baru -->
    <div class="sub-menu" id="sub-menu-container" style="display:none;">
      <button class="btn-sub active" data-status="pending">Pending Approval</button>
      <button class="btn-sub" data-status="approved">On Progress</button>
      <button class="btn-sub" data-status="pending_finished">Pending Finished</button>
      <button class="btn-sub" data-status="finished">Finished</button>
      <button class="btn-sub" data-status="rejected">Rejected</button>
    </div>

    <!-- Filter Waktu -->
    <div class="filter-bar glass-panel">
      <select id="filter-type">
        <option value="all">Semua Waktu</option>
        <option value="single">Tanggal Tertentu</option>
        <option value="range">Rentang Tanggal</option>
      </select>
      
      <div id="filter-date-1-container" style="display:none; align-items:center; gap:8px;">
        <span style="font-size:13px; color:var(--text-muted);">Tgl:</span>
        <input type="date" id="filter-date-1">
      </div>
      
      <div id="filter-date-2-container" style="display:none; align-items:center; gap:8px;">
        <span style="font-size:13px; color:var(--text-muted);">s/d</span>
        <input type="date" id="filter-date-2">
      </div>
      
      <button id="btn-apply-filter">Terapkan Filter</button>
    </div>

    <div class="panel glass-panel" id="panel">
      <div class="placeholder">Memuat data...</div>
    </div>
  </main>
</div>

<!-- Modal Detail -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-content glass-panel">
    <div class="modal-header">
      <h3 id="modal-title">Detail Work Order</h3>
      <button class="close-btn" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body">
      <!-- Detail tabel akan di-render menggunakan JavaScript disini -->
    </div>
  </div>
</div>

<script>
// ============================================================================
// KONFIGURASI URL & GID
// ============================================================================
const SHEET_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7E84yJuZInmkqB0NJMMPpPAaGHvd9sIZHwZvzR4tROm9k9I2k6gqCd0ksKiVA4l08jJxVRF5uP-Rm/pub"; 

// PERHATIAN: Masukkan link hasil DEPLOY APPS SCRIPT YANG BARU ke sini
const LOGIN_API_URL = "MASUKKAN_LINK_WEB_APP_APPS_SCRIPT_TERBARU_DISINI";

// Tambahkan GID untuk ke-6 sheet baru di bawah ini jika sudah dibuat
const SHEETS_GID = {
  master: "172504616",

  // MECHANICAL
  mechanical_pending: "83528035",
  mechanical_approved: "709234165",
  mechanical_rejected: "1634138009",
  mechanical_pending_finished: "1413084397",
  mechanical_finished: "624075101",

  // ELECTRICAL
  electrical_pending: "1373466339",
  electrical_approved: "1933576686",
  electrical_rejected: "1253140954",
  electrical_pending_finished: "1392154686",
  electrical_finished: "854971381",

  // MODIFICATION
  modification_pending: "2072013900",
  modification_approved: "697781984",
  modification_rejected: "309859811",
  modification_pending_finished: "757960950",
  modification_finished: "1272375466"
};

// ============================================================================
// VARIABEL GLOBAL PENYIMPANAN STATE APLIKASI
// ============================================================================
let activeCategory = "master"; 
let activeStatus = "pending"; 

let currentHeaders = [];
let currentDataRows = [];
let targetRequestId = ""; 

// ============================================================================
// LOGIKA NAVIGASI (MENU UTAMA & SUB MENU)
// ============================================================================
const mainBtns = document.querySelectorAll(".btn-main");
const subBtns = document.querySelectorAll(".btn-sub");
const subMenuContainer = document.getElementById("sub-menu-container");
const panel = document.getElementById("panel");

mainBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    activeCategory = btn.getAttribute("data-category");
    
    mainBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    if (activeCategory === "master") {
      subMenuContainer.style.display = "none";
    } else {
      subMenuContainer.style.display = "flex";
    }
    
    fetchData();
  });
});

subBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    activeStatus = btn.getAttribute("data-status");
    
    subBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    
    fetchData();
  });
});

// ============================================================================
// LOGIKA FILTER WAKTU
// ============================================================================
const filterType = document.getElementById("filter-type");
const date1Cont = document.getElementById("filter-date-1-container");
const date2Cont = document.getElementById("filter-date-2-container");
const date1Input = document.getElementById("filter-date-1");
const date2Input = document.getElementById("filter-date-2");
const btnApplyFilter = document.getElementById("btn-apply-filter");

filterType.addEventListener("change", () => {
  const val = filterType.value;
  if (val === "all") {
    date1Cont.style.display = "none";
    date2Cont.style.display = "none";
  } else if (val === "single") {
    date1Cont.style.display = "flex";
    date2Cont.style.display = "none";
  } else if (val === "range") {
    date1Cont.style.display = "flex";
    date2Cont.style.display = "flex";
  }
});

btnApplyFilter.addEventListener("click", () => { 
  renderData(); 
});

function parseCSVDateToISO(dateStr) {
  if (!dateStr) return "";
  let cleanStr = dateStr.split(" ")[0]; 
  if (cleanStr.includes("/")) {
    let parts = cleanStr.split("/");
    if (parts.length === 3 && parts[2].length === 4) {
      return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
    }
  }
  let d = new Date(dateStr);
  if (!isNaN(d.getTime())) return d.toISOString().split("T")[0];
  return cleanStr; 
}

// ============================================================================
// LOGIKA PENGAMBILAN & PARSING DATA CSV
// ============================================================================
function csvUrl(gid){
  return `${SHEET_BASE}?gid=${gid}&single=true&output=csv`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { 
          field += '"'; i++; 
        } else {
          inQuotes = false;
        }
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); 
        field = ""; 
      } else if (c === '\n') {
        row.push(field); 
        rows.push(row); 
        row = []; 
        field = ""; 
      } else if (c === '\r') {
        // Abaikan return character
      } else {
        field += c;
      }
    }
  }
  if (field.length || row.length) { 
    row.push(field); 
    rows.push(row); 
  }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

function findColumnsIndex(header) {
  const woIdx = header.findIndex(h => h.toLowerCase().trim().includes("nomor wo"));
  const reqIdx = header.findIndex(h => h.toLowerCase().trim().includes("request id"));
  const nameIdx = header.findIndex(h => h.toLowerCase().trim() === "nama" || h.toLowerCase().trim().includes("nama pemohon"));
  const dateIdx = header.findIndex(h => h.toLowerCase().trim().includes("timestamp") || h.toLowerCase().trim().includes("tanggal"));
  
  return {
    idIdx: woIdx !== -1 ? woIdx : (reqIdx !== -1 ? reqIdx : 0),
    nameIdx: nameIdx !== -1 ? nameIdx : 1,
    dateIdx: dateIdx !== -1 ? dateIdx : -1
  };
}

async function fetchData() {
  panel.innerHTML = `<div class="state">Memuat data...</div>`;

  try {
    // JIKA MASTER WO DIPILIH: GABUNGKAN 3 SHEET ON PROGRESS SECARA OTOMATIS
    if (activeCategory === "master") {
      const gids = [
        SHEETS_GID.mechanical_approved,
        SHEETS_GID.electrical_approved,
        SHEETS_GID.modification_approved
      ];
      
      let combinedRows = [];
      let masterHeaders = [];
      
      // Fetching ketiga data secara bersamaan (Paralel)
      const fetches = gids.map(gid => fetch(csvUrl(gid)));
      const responses = await Promise.all(fetches);
      
      for (let i = 0; i < responses.length; i++) {
        if (!responses[i].ok) continue;
        const text = await responses[i].text();
        const rows = parseCSV(text);
        
        if (rows.length < 2) continue;
        
        if (masterHeaders.length === 0) {
          masterHeaders = rows[0]; 
        }
        
        combinedRows = combinedRows.concat(rows.slice(1));
      }
      
      currentHeaders = masterHeaders;
      currentDataRows = combinedRows;

      if (currentDataRows.length === 0) {
        panel.innerHTML = `<h2>Semua Data Master WO (On Progress)</h2><div class="state error">Tidak ada tiket On Progress saat ini.</div>`;
        return;
      }
      
      renderData();

    // JIKA MENU BIASA DIPILIH
    } else {
      const sheetKey = `${activeCategory}_${activeStatus}`;
      const gid = SHEETS_GID[sheetKey];
      let title = `Data ${activeCategory} - ${activeStatus}`;
      
      const res = await fetch(csvUrl(gid));
      if (!res.ok) throw new Error("Gagal mengambil data (status " + res.status + ")");
      const text = await res.text();
      const rows = parseCSV(text);

      if (rows.length < 2) {
        panel.innerHTML = `<h2>${title}</h2><div class="state error">Data kosong.</div>`;
        currentHeaders = [];
        currentDataRows = [];
        return;
      }

      currentHeaders = rows[0];
      currentDataRows = rows.slice(1);
      
      renderData(); 
    }
  } catch (err) {
    panel.innerHTML = `<h2>Data Error</h2><div class="state error">Gagal memuat: ${escapeHtml(err.message)}</div>`;
  }
}

function renderData() {
  let title = activeCategory === "master" ? "Semua Data Master WO (On Progress)" : `Data ${activeCategory} - ${activeStatus}`;
  const cols = findColumnsIndex(currentHeaders);
  
  const filterVal = filterType.value;
  const d1 = date1Input.value;
  const d2 = date2Input.value;
  
  let filteredItems = [];

  for (let i = 0; i < currentDataRows.length; i++) {
    const r = currentDataRows[i];
    let include = true;

    // Cek Filter Waktu
    if (cols.dateIdx !== -1 && filterVal !== "all") {
      const rowDateIso = parseCSVDateToISO(r[cols.dateIdx]);
      if (filterVal === "single" && d1) {
        if (rowDateIso !== d1) include = false;
      } else if (filterVal === "range" && d1 && d2) {
        if (rowDateIso < d1 || rowDateIso > d2) include = false;
      }
    }

    if (include) {
      const req = (r[cols.idIdx] || "").trim();
      const name = (r[cols.nameIdx] || "").trim();
      let displayStr = "";
      
      if (req && name) {
        displayStr = `<strong>${escapeHtml(req)}</strong> &mdash; ${escapeHtml(name)}`;
      } else {
        displayStr = escapeHtml(req || name);
      }
      
      filteredItems.push({ originalIndex: i, html: displayStr, reqId: req });
    }
  }

  if (filteredItems.length === 0) {
    panel.innerHTML = `<h2>${title}</h2><div class="state">Tidak ada tiket yang sesuai dengan filter.</div>`;
    return;
  }

  // Render HTML untuk Daftar Tiket
  panel.innerHTML = `
    <h2>${title}</h2>
    <div class="count">${filteredItems.length} tiket ditemukan</div>
    <ul class="data-list">
      ${filteredItems.map((item, idx) => `
        <li onclick="showModal(${item.originalIndex}, '${item.reqId}')">
          <span class="num">${idx+1}</span>
          <div>${item.html}</div>
        </li>`).join("")}
    </ul>
  `;
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================================
// LOGIKA MODAL & ACTION ROLE BASED
// ============================================================================
const modalOverlay = document.getElementById("modal-overlay");
const modalBody = document.getElementById("modal-body");
const btnCloseModal = document.getElementById("modal-close");

function showModal(originalIndex, reqId) {
  const rowData = currentDataRows[originalIndex];
  targetRequestId = reqId; // Simpan ID ini untuk digunakan oleh tombol aksi
  let html = "";
  
  // Render Baris Detail
  for (let i = 0; i < currentHeaders.length; i++) {
    const headerName = currentHeaders[i] ? currentHeaders[i].trim() : `Kolom ${i+1}`;
    const value = rowData[i] ? rowData[i].trim() : "-";
    
    if (headerName !== "") {
      html += `
        <div class="detail-row">
          <div class="detail-label">${escapeHtml(headerName)}</div>
          <div class="detail-value">${escapeHtml(value)}</div>
        </div>
      `;
    }
  }

  // Cek Role Pengguna Saat Ini
  const userRole = sessionStorage.getItem("userRole");
  
  // LOGIKA TAMPILAN TOMBOL BERDASARKAN ROLE (Hanya tampil jika bukan di Master WO)
  if (activeCategory !== "master") {
    
    // 1. Jika Engineering & Status Pending Approval
    if (userRole === "engineering" && activeStatus === "pending") {
      html += `
        <div class="action-footer" id="action-footer">
          <button class="btn-action btn-approve" onclick="executeAction('approved')">Terima (Approve)</button>
          <button class="btn-action btn-reject" onclick="executeAction('rejected')">Tolak (Reject)</button>
        </div>
        <div id="action-msg" style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);"></div>
      `;
    } 
    
    // 2. Jika Engineering & Status On Progress (Approved)
    else if (userRole === "engineering" && activeStatus === "approved") {
      html += `
        <div class="action-footer" id="action-footer">
          <button class="btn-action btn-approve" style="background:var(--accent-blue);" onclick="executeAction('pending_finished')">Selesaikan WO (Kirim ke Pending Finished)</button>
        </div>
        <div id="action-msg" style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);"></div>
      `;
    }

    // 3. Jika User & Status Pending Finished
    else if (userRole === "user" && activeStatus === "pending_finished") {
      html += `
        <div class="action-footer" id="action-footer">
          <button class="btn-action btn-approve" style="background:var(--accent-green);" onclick="executeAction('finished')">Konfirmasi WO Selesai</button>
        </div>
        <div id="action-msg" style="text-align:center; margin-top:10px; font-size:12px; color:var(--text-muted);"></div>
      `;
    }
  }
  
  modalBody.innerHTML = html;
  modalOverlay.style.display = "flex";
}

// Fungsi untuk mengirim aksi ke Apps Script API
async function executeAction(actionType) {
  let rejectReason = "";
  let biayaWo = "";
  
  // Prompt khusus berdasarkan jenis aksi
  if (actionType === "rejected") {
    rejectReason = prompt("Mohon masukkan alasan menolak (Reject) tiket ini:");
    if (rejectReason === null || rejectReason.trim() === "") {
      alert("Aksi dibatalkan: Alasan penolakan wajib diisi!");
      return;
    }
  } else if (actionType === "pending_finished") {
    biayaWo = prompt("Mohon masukkan total Biaya WO untuk tiket ini:");
    if (biayaWo === null || biayaWo.trim() === "") {
      alert("Aksi dibatalkan: Biaya WO wajib diisi!");
      return;
    }
  } else if (actionType === "finished") {
    if (!confirm(`Anda yakin mengkonfirmasi bahwa tiket ini benar-benar selesai?`)) {
      return;
    }
  } else if (actionType === "approved") {
    if (!confirm(`Anda yakin ingin menerima (Approve) tiket ini?`)) {
      return;
    }
  }

  const btnFooter = document.getElementById("action-footer");
  const msgBox = document.getElementById("action-msg");
  
  // Matikan tombol agar tidak bisa diklik berulang kali
  const buttons = btnFooter.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  
  msgBox.innerHTML = "Memproses data ke server, mohon tunggu...";
  msgBox.style.color = "var(--text-muted)";

  try {
    const res = await fetch(LOGIN_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ 
        type: "action", 
        action: actionType, 
        category: activeCategory, 
        requestId: targetRequestId,
        rejectReason: rejectReason, 
        biayaWo: biayaWo 
      })
    });
    
    const result = await res.json();

    if (result.success) {
      msgBox.innerHTML = "Berhasil! Data telah diperbarui.";
      msgBox.style.color = "var(--accent-green)";
      
      // Tutup modal secara otomatis dan refresh data
      setTimeout(() => {
        modalOverlay.style.display = "none";
        fetchData(); 
      }, 1500);
      
    } else {
      msgBox.innerHTML = "Gagal: " + result.message;
      msgBox.style.color = "var(--rejected)";
      buttons.forEach(b => b.disabled = false); 
    }
  } catch (err) {
    msgBox.innerHTML = "Gagal menghubungi server.";
    msgBox.style.color = "var(--rejected)";
    buttons.forEach(b => b.disabled = false);
  }
}

btnCloseModal.addEventListener("click", () => { 
  modalOverlay.style.display = "none"; 
});

modalOverlay.addEventListener("click", (e) => { 
  if(e.target === modalOverlay) {
    modalOverlay.style.display = "none"; 
  }
});

// ============================================================================
// LOGIKA SISTEM LOGIN & AUTHENTIKASI
// ============================================================================
const loginScreen = document.getElementById("login-screen");
const appContent = document.getElementById("app-content");
const loginForm = document.getElementById("login-form");
const loginMsg = document.getElementById("login-msg");
const loginSubmit = document.getElementById("login-submit");
const roleBadge = document.getElementById("user-role-badge");

// Pengecekan sesi aktif saat halaman dimuat
if (sessionStorage.getItem("loggedIn") === "true") {
  loginScreen.style.display = "none";
  appContent.style.display = "block";
  roleBadge.textContent = "Akses: " + (sessionStorage.getItem("userRole") || "USER").toUpperCase();
  fetchData(); 
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value.trim();

  loginMsg.textContent = "";
  loginSubmit.disabled = true;
  loginSubmit.textContent = "Memeriksa...";

  try {
    const res = await fetch(LOGIN_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ 
        type: "login", 
        username, 
        password 
      })
    });
    
    const result = await res.json();

    if (result.success) {
      // Simpan status login dan role ke sistem peramban
      sessionStorage.setItem("loggedIn", "true");
      sessionStorage.setItem("userRole", result.role || "user");
      
      loginScreen.style.display = "none";
      appContent.style.display = "block";
      roleBadge.textContent = "Akses: " + (result.role || "user").toUpperCase();
      fetchData(); 
    } else {
      loginMsg.textContent = result.message || "ID atau password salah.";
    }
  } catch (err) {
    loginMsg.textContent = "Gagal menghubungi server login.";
  } finally {
    loginSubmit.disabled = false;
    loginSubmit.textContent = "Masuk";
  }
});

document.getElementById("logout-btn").addEventListener("click", () => {
  sessionStorage.removeItem("loggedIn");
  sessionStorage.removeItem("userRole");
  loginForm.reset();
  appContent.style.display = "none";
  loginScreen.style.display = "flex";
});
</script>
