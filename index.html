<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direktori Pegawai</title>
<style>
  :root{
    --ink:#1c2230;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#dfdad0;
    --keuangan:#2f6f4f;
    --keuangan-bg:#eaf3ec;
    --teknik:#8a4a12;
    --teknik-bg:#f6ece0;
    --muted:#726f68;
    --primary: #2a5c8a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  header{
    padding:48px 24px 24px;
    text-align:center;
  }
  header .eyebrow{
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
  }
  header h1{
    font-size:clamp(28px,4vw,40px);
    margin:0;
    font-weight:700;
  }
  header p{
    color:var(--muted);
    margin-top:10px;
  }
  
  /* --- STYLING UNTUK LOGIN --- */
  #login-section {
    max-width: 400px;
    margin: 40px auto;
    padding: 0 24px;
  }
  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .input-group input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 14px; }
  .input-group input:focus { outline: none; border-color: var(--primary); }
  #btn-login { width: 100%; padding: 14px; background: var(--ink); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  #btn-login:hover { background: #000; }
  #btn-login:disabled { background: var(--muted); cursor: not-allowed; }
  .login-error { color: #b23b3b; font-size: 13px; margin-bottom: 16px; padding: 10px; background: #faeaea; border-radius: 6px; display: none; text-align: center; }

  /* --- STYLING APLIKASI UTAMA --- */
  #app-section { display: none; } /* Disembunyikan sebelum login */
  main{
    max-width:880px;
    margin:0 auto;
    padding:0 24px 64px;
  }
  .menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:28px;
  }
  @media (max-width:560px){
    .menu{grid-template-columns:1fr;}
  }
  .menu-btn{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:14px;
    padding:22px 20px;
    text-align:left;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    font-family:inherit;
  }
  .menu-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.06);
  }
  .menu-btn .tag{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .menu-btn.keuangan .tag{background:var(--keuangan-bg); color:var(--keuangan);}
  .menu-btn.teknik .tag{background:var(--teknik-bg); color:var(--teknik);}
  .menu-btn.active{border-color:var(--ink);}
  .menu-btn h3{margin:0 0 4px; font-size:19px;}
  .menu-btn p{margin:0; font-size:13px; color:var(--muted);}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    min-height:160px;
  }
  .panel h2{
    margin:0 0 4px;
    font-size:20px;
  }
  .panel .count{
    font-size:13px;
    color:var(--muted);
    margin-bottom:18px;
  }
  ul.employee-list{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:10px;
  }
  ul.employee-list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
  }
  ul.employee-list li .num{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .placeholder, .state{
    color:var(--muted);
    font-size:14px;
    padding:20px 0;
    text-align:center;
  }
  .state.error{color:#b23b3b;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Direktori Internal</div>
  <h1>Data Pegawai per Bagian</h1>
  <p id="header-desc">Silakan masuk untuk melanjutkan.</p>
</header>

<!-- SECTION LOGIN -->
<div id="login-section">
  <div class="panel">
    <h2 style="text-align: center; margin-bottom: 24px;">Login</h2>
    <div id="login-error" class="login-error">ID atau Password salah!</div>
    
    <div class="input-group">
      <label for="input-id">ID Pengguna</label>
      <input type="text" id="input-id" placeholder="Masukkan ID">
    </div>
    <div class="input-group">
      <label for="input-pass">Password</label>
      <input type="password" id="input-pass" placeholder="Masukkan password">
    </div>
    
    <button id="btn-login">Masuk</button>
  </div>
</div>

<!-- SECTION APLIKASI UTAMA -->
<main id="app-section">
  <div class="menu">
    <button class="menu-btn keuangan" id="btn-keuangan">
      <span class="tag">Menu 1</span>
      <h3>Bagian Keuangan</h3>
      <p>Lihat daftar pegawai bagian keuangan</p>
    </button>
    <button class="menu-btn teknik" id="btn-teknik">
      <span class="tag">Menu 2</span>
      <h3>Bagian Teknik</h3>
      <p>Lihat daftar pegawai bagian teknik</p>
    </button>
  </div>

  <div class="panel" id="panel">
    <div class="placeholder">Klik salah satu bagian di atas untuk menampilkan daftar pegawai.</div>
  </div>
</main>

<script>
const SHEET_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqGoRVZPqNYVix0fz_dIX4nkQKsXfn0K0xC6srxbC9mNB_PA9Cwj7ohLFUNOHAWDjp8LSvlU8x4lQp/pub";

// KONFIGURASI GID
const CONFIG = {
  login_gid: "1106072435", // GID Sheet Login (Sheet "ID")
  keuangan_gid: "186650531",
  teknik_gid: "565200320"
};

const DEPARTMENTS = {
  keuangan: { label: "Bagian Keuangan", gid: CONFIG.keuangan_gid },
  teknik: { label: "Bagian Teknik", gid: CONFIG.teknik_gid }
};

function csvUrl(gid){
  return `${SHEET_BASE}?gid=${gid}&single=true&output=csv`;
}

// Parser CSV
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

/* =========================================
   LOGIKA LOGIN
   ========================================= */
document.getElementById('btn-login').addEventListener('click', async () => {
  const inputId = document.getElementById('input-id').value.trim();
  const inputPass = document.getElementById('input-pass').value.trim();
  const btn = document.getElementById('btn-login');
  const errorDiv = document.getElementById('login-error');

  if(!inputId || !inputPass){
    errorDiv.textContent = "ID dan Password harus diisi.";
    errorDiv.style.display = "block";
    return;
  }

  // Tampilan loading
  btn.textContent = "Memeriksa...";
  btn.disabled = true;
  errorDiv.style.display = "none";

  try {
    const res = await fetch(csvUrl(CONFIG.login_gid));
    if (!res.ok) throw new Error("Gagal memeriksa data login.");
    const text = await res.text();
    const rows = parseCSV(text);

    let isValid = false;
    let userName = "";

    // Mulai dari i=1 untuk melewati header tabel
    for(let i = 1; i < rows.length; i++){
      const row = rows[i];
      // Asumsi: Kolom 0 adalah ID, Kolom 1 adalah Password, Kolom 2 adalah Nama
      if(row[0] && row[1]){
        if(row[0].trim() === inputId && row[1].trim() === inputPass){
          isValid = true;
          userName = row[2] ? row[2].trim() : "User";
          break;
        }
      }
    }

    if(isValid){
      // Sembunyikan login, tampilkan aplikasi
      document.getElementById('login-section').style.display = "none";
      document.getElementById('app-section').style.display = "block";
      document.getElementById('header-desc').textContent = `Selamat datang, ${userName}. Pilih bagian di bawah.`;
    } else {
      errorDiv.textContent = "ID atau Password salah!";
      errorDiv.style.display = "block";
    }

  } catch (err) {
    errorDiv.textContent = err.message;
    errorDiv.style.display = "block";
  } finally {
    btn.textContent = "Masuk";
    btn.disabled = false;
  }
});

/* =========================================
   LOGIKA APLIKASI UTAMA
   ========================================= */
const panel = document.getElementById("panel");
const buttons = {
  keuangan: document.getElementById("btn-keuangan"),
  teknik: document.getElementById("btn-teknik")
};

Object.keys(buttons).forEach(key => {
  buttons[key].addEventListener("click", () => loadDepartment(key));
});

function findNameColumnIndex(header){
  const idx = header.findIndex(h => h.toLowerCase().trim().includes("nama"));
  return idx !== -1 ? idx : 0;
}

async function loadDepartment(key){
  Object.values(buttons).forEach(b => b.classList.remove("active"));
  buttons[key].classList.add("active");

  const dept = DEPARTMENTS[key];
  panel.innerHTML = `<div class="state">Memuat data ${dept.label}...</div>`;

  try {
    const res = await fetch(csvUrl(dept.gid));
    if (!res.ok) throw new Error("Gagal mengambil data (status " + res.status + ")");
    const text = await res.text();
    const rows = parseCSV(text);

    if (rows.length === 0){
      panel.innerHTML = `<div class="state error">Data ${dept.label} kosong atau tidak ditemukan.</div>`;
      return;
    }

    const header = rows[0];
    const nameIdx = findNameColumnIndex(header);
    const names = rows.slice(1)
      .map(r => (r[nameIdx] || "").trim())
      .filter(n => n !== "");

    if (names.length === 0){
      panel.innerHTML = `<div class="state error">Tidak ada nama pegawai yang terbaca di ${dept.label}.</div>`;
      return;
    }

    panel.innerHTML = `
      <h2>${dept.label}</h2>
      <div class="count">${names.length} pegawai</div>
      <ul class="employee-list">
        ${names.map((n, i) => `<li><span class="num">${i+1}</span>${escapeHtml(n)}</li>`).join("")}
      </ul>
    `;
  } catch (err){
    panel.innerHTML = `<div class="state error">Terjadi kesalahan: ${escapeHtml(err.message)}</div>`;
  }
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
