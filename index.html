<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Master WO</title>
<style>
  :root{
    --ink:#1c2230;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#dfdad0;
    --master:#1c2230;
    --mech:#2f6f4f;
    --elec:#8a4a12;
    --mod:#3b5998;
    --pending:#b28b22;
    --approved:#2f6f4f;
    --rejected:#b23b3b;
    --muted:#726f68;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  header{
    padding:48px 24px 24px;
    text-align:center;
  }
  header h1{
    font-size:clamp(28px,4vw,40px);
    margin:0;
    font-weight:700;
  }
  header p{
    color:var(--muted);
    margin-top:10px;
  }
  main{
    max-width:880px;
    margin:0 auto;
    padding:0 24px 64px;
  }
  
  /* Menu Utama */
  .main-menu{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
    margin-bottom:20px;
  }
  @media (max-width:600px){
    .main-menu{grid-template-columns:1fr 1fr;}
  }
  .btn-main{
    padding:16px 10px;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:all .15s;
    font-family:inherit;
    color:var(--muted);
  }
  .btn-main.active{
    border-color:var(--ink);
    color:var(--ink);
    box-shadow:0 4px 12px rgba(0,0,0,.05);
  }
  .btn-main:hover:not(.active){ background:var(--paper); }

  /* Sub Menu */
  .sub-menu{
    display:flex;
    gap:10px;
    margin-bottom:28px;
    justify-content:center;
  }
  .btn-sub{
    padding:8px 18px;
    border:1px solid var(--line);
    border-radius:99px;
    background:var(--panel);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
    transition:all .15s;
  }
  .btn-sub.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  /* Panel Data */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    min-height:160px;
  }
  .panel h2{ margin:0 0 4px; font-size:20px; text-transform:capitalize; }
  .panel .count{ font-size:13px; color:var(--muted); margin-bottom:18px; }
  
  ul.data-list{
    list-style:none; margin:0; padding:0; display:grid; gap:10px;
  }
  ul.data-list li{
    display:flex; align-items:center; gap:12px;
    padding:12px 14px; border:1px solid var(--line);
    border-radius:10px; background:var(--paper);
    font-size:14px;
  }
  ul.data-list li .num{
    width:26px; height:26px; border-radius:50%;
    background:var(--ink); color:#fff; font-size:12px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  
  .placeholder, .state{ color:var(--muted); font-size:14px; padding:20px 0; text-align:center; }
  .state.error{ color:var(--rejected); }

  /* Login & Logout (Sama seperti sebelumnya) */
  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-box{ width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:32px 28px; text-align:center; }
  #login-form{ display:flex; flex-direction:column; gap:6px; text-align:left; margin-top:20px;}
  #login-form label{ font-size:12px; color:var(--muted); margin-top:10px; }
  #login-form input{ padding:11px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  #login-submit{ margin-top:18px; padding:12px; border:none; border-radius:8px; background:var(--ink); color:#fff; cursor:pointer; font-weight:600; }
  .logout-btn{ margin-top:16px; padding:8px 16px; border:1px solid var(--line); border-radius:8px; background:var(--panel); font-size:13px; cursor:pointer; }
  .login-msg{ color:var(--rejected); font-size:13px; margin-top:10px; text-align:center;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>Aplikasi WO</h1>
    <form id="login-form">
      <label>ID</label>
      <input type="text" id="login-username" required>
      <label>Password</label>
      <input type="password" id="login-password" required>
      <button type="submit" id="login-submit">Masuk</button>
      <div class="login-msg" id="login-msg"></div>
    </form>
  </div>
</div>

<div id="app-content" style="display:none;">
  <header>
    <h1>Dashboard Master WO</h1>
    <p>Pantau keseluruhan tiket Work Order secara realtime.</p>
    <button id="logout-btn" class="logout-btn">Keluar</button>
  </header>

  <main>
    <!-- Menu Utama (Kategori) -->
    <div class="main-menu">
      <button class="btn-main active" data-category="master">Master WO</button>
      <button class="btn-main" data-category="mechanical">Mechanical</button>
      <button class="btn-main" data-category="electrical">Electrical</button>
      <button class="btn-main" data-category="modification">Modification</button>
    </div>

    <!-- Sub Menu (Status) - Disembunyikan saat Master WO aktif -->
    <div class="sub-menu" id="sub-menu-container" style="display:none;">
      <button class="btn-sub active" data-status="pending">Pending Approval</button>
      <button class="btn-sub" data-status="approved">Approved</button>
      <button class="btn-sub" data-status="rejected">Rejected</button>
    </div>

    <div class="panel" id="panel">
      <div class="placeholder">Memuat data...</div>
    </div>
  </main>
</div>

<script>
// --- KONFIGURASI URL & GID (TOTAL 10 SHEET) ---
const SHEET_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7E84yJuZInmkqB0NJMMPpPAaGHvd9sIZHwZvzR4tROm9k9I2k6gqCd0ksKiVA4l08jJxVRF5uP-Rm/pub"; 
const LOGIN_API_URL = "https://script.google.com/a/macros/std.stei.itb.ac.id/s/AKfycbz3i2MgKIKGkFPYr7CLn-TzCBGc4E1h0pNIIg0H5wfP3Tk4MpdT8SLU52VjjwzG0-qe/exec";

const SHEETS_GID = {
  master: "172504616",
  
  mechanical_pending: "83528035",
  mechanical_approved: "709234165",
  mechanical_rejected: "1634138009",
  
  electrical_pending: "1373466339",
  electrical_approved: "1933576686",
  electrical_rejected: "1253140954",
  
  modification_pending: "2072013900",
  modification_approved: "697781984",
  modification_rejected: "309859811"
};

/* ================= LOGIKA UI & NAVIGASI ================= */
let activeCategory = "master"; 
let activeStatus = "pending"; 

const mainBtns = document.querySelectorAll(".btn-main");
const subBtns = document.querySelectorAll(".btn-sub");
const subMenuContainer = document.getElementById("sub-menu-container");
const panel = document.getElementById("panel");

// Event saat Menu Utama diklik
mainBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    activeCategory = btn.getAttribute("data-category");
    
    // Update tombol aktif
    mainBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    // Tampilkan/sembunyikan sub-menu
    if(activeCategory === "master"){
      subMenuContainer.style.display = "none";
    } else {
      subMenuContainer.style.display = "flex";
    }
    
    loadData();
  });
});

// Event saat Sub Menu diklik
subBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    activeStatus = btn.getAttribute("data-status");
    
    // Update tombol aktif
    subBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    
    loadData();
  });
});

/* ================= LOGIKA PENGAMBILAN DATA CSV ================= */
function csvUrl(gid){
  return `${SHEET_BASE}?gid=${gid}&single=true&output=csv`;
}

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim() !== ""));
}

// Cari kolom Request ID / Nomor WO dan Nama pemohon secara dinamis
function findColumnsIndex(header){
  const woIdx = header.findIndex(h => h.toLowerCase().trim().includes("nomor wo"));
  const reqIdx = header.findIndex(h => h.toLowerCase().trim().includes("request id"));
  const nameIdx = header.findIndex(h => h.toLowerCase().trim() === "nama" || h.toLowerCase().trim().includes("nama pemohon"));
  
  return {
    idIdx: woIdx !== -1 ? woIdx : (reqIdx !== -1 ? reqIdx : 0),
    nameIdx: nameIdx !== -1 ? nameIdx : 1
  };
}

async function loadData(){
  // Tentukan kunci sheet yang akan diambil
  const sheetKey = activeCategory === "master" ? "master" : `${activeCategory}_${activeStatus}`;
  const gid = SHEETS_GID[sheetKey];
  
  // Format Judul Panel
  let title = activeCategory === "master" ? "Semua Data Master WO" : `Data ${activeCategory} - ${activeStatus}`;
  
  panel.innerHTML = `<div class="state">Memuat ${title}...</div>`;

  try {
    const res = await fetch(csvUrl(gid));
    if (!res.ok) throw new Error("Gagal mengambil data (status " + res.status + ")");
    const text = await res.text();
    const rows = parseCSV(text);

    if (rows.length < 2){
      panel.innerHTML = `<h2>${title}</h2><div class="state error">Data kosong.</div>`;
      return;
    }

    const header = rows[0];
    const cols = findColumnsIndex(header);
    
    // Gabungkan ID dan Nama (Contoh: "WR-UTL-001 - Budi")
    const dataItems = rows.slice(1)
      .map(r => {
         const req = (r[cols.idIdx] || "").trim();
         const name = (r[cols.nameIdx] || "").trim();
         if(req && name) return `<strong>${escapeHtml(req)}</strong> &mdash; ${escapeHtml(name)}`;
         return escapeHtml(req || name);
      })
      .filter(n => n !== "");

    panel.innerHTML = `
      <h2>${title}</h2>
      <div class="count">${dataItems.length} tiket ditemukan</div>
      <ul class="data-list">
        ${dataItems.map((n, i) => `<li><span class="num">${i+1}</span><div>${n}</div></li>`).join("")}
      </ul>
    `;
  } catch (err){
    panel.innerHTML = `<h2>${title}</h2>
      <div class="state error">Gagal memuat: ${escapeHtml(err.message)}<br><br>Pastikan GID sudah disetting.</div>`;
  }
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ================= LOGIKA LOGIN ================= */
// (Kode Login dan Logout tetap dipertahankan persis sama)
const loginScreen = document.getElementById("login-screen");
const appContent = document.getElementById("app-content");
const loginForm = document.getElementById("login-form");
const loginMsg = document.getElementById("login-msg");
const loginSubmit = document.getElementById("login-submit");

if (sessionStorage.getItem("loggedIn") === "true"){
  loginScreen.style.display = "none";
  appContent.style.display = "block";
  loadData(); // Load Master WO saat pertama masuk
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value.trim();

  loginMsg.textContent = "";
  loginSubmit.disabled = true;
  loginSubmit.textContent = "Memeriksa...";

  try {
    const res = await fetch(LOGIN_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ username, password })
    });
    const result = await res.json();

    if (result.success){
      sessionStorage.setItem("loggedIn", "true");
      loginScreen.style.display = "none";
      appContent.style.display = "block";
      loadData(); // Load Master WO saat login berhasil
    } else {
      loginMsg.textContent = result.message || "ID atau password salah.";
    }
  } catch (err){
    loginMsg.textContent = "Gagal menghubungi server login.";
  } finally {
    loginSubmit.disabled = false;
    loginSubmit.textContent = "Masuk";
  }
});

document.getElementById("logout-btn").addEventListener("click", () => {
  sessionStorage.removeItem("loggedIn");
  loginForm.reset();
  appContent.style.display = "none";
  loginScreen.style.display = "flex";
});
</script>

</body>
</html>
